<!--
  The board the cross-section is cut out of. Drawn by hand rather than
  generated: chunky traces, fat vias, two chips with legs, one resistor sitting
  astride the bus. Used as a CSS mask, so only the alpha matters here; the
  colour is the circuit token in app/globals.css and follows the theme.

  It tiles: the only paths that touch an edge are the horizontal bus (enters and
  leaves at y=52) and the vertical bus (enters and leaves at x=192). Everything
  else stays inside the 240 box with room for the stroke, so nothing clips at a
  seam. Move a component and check both of those before shipping.

  Note for editors: an XML comment cannot contain a double hyphen, so the CSS
  variable names are spelled out in words above rather than written literally.
-->
<svg
	xmlns="http://www.w3.org/2000/svg"
	width="240"
	height="240"
	viewBox="0 0 240 240"
	fill="none"
	stroke="#fff"
	stroke-width="3"
	stroke-linecap="round"
	stroke-linejoin="round"
>
	<!-- The two buses, and the joints where anything tees off them. -->
	<path d="M0 52H64L84 32H156L176 52H240" />
	<path d="M192 0V96M192 122V240" />
	<rect x="184" y="96" width="16" height="26" rx="5" />
	<circle cx="192" cy="52" r="4.5" fill="#fff" stroke="none" />
	<circle cx="192" cy="150" r="4.5" fill="#fff" stroke="none" />
	<circle cx="192" cy="206" r="4.5" fill="#fff" stroke="none" />

	<!-- Right of the vertical bus: a via and a solder pad. -->
	<path d="M192 150H212" />
	<circle cx="218" cy="150" r="6" />
	<path d="M192 206H208" />
	<rect x="208" y="196" width="20" height="20" rx="4" />

	<!-- The big chip, pin one marked, legs on three sides. -->
	<rect x="24" y="96" width="80" height="60" rx="10" />
	<circle cx="38" cy="110" r="4" fill="#fff" stroke="none" />
	<path
		d="M12 112H24M12 126H24M12 140H24M104 112H116M104 126H116M104 140H116M44 156V168M64 156V168M84 156V168"
	/>

	<!-- Its middle leg runs out to the small chip. -->
	<path d="M116 126H140L160 146V172" />
	<rect x="124" y="172" width="52" height="40" rx="8" />
	<path d="M136 160V172M148 160V172M136 212V224M160 212V224" />

	<!-- Down from the big chip into a via, then away to the right. -->
	<path d="M44 168V189" />
	<circle cx="44" cy="196" r="7" />
	<circle cx="44" cy="196" r="2.5" fill="#fff" stroke="none" />
	<path d="M44 203V216H96" />

	<!-- Top-left feed into the horizontal bus, and a capacitor under it. -->
	<circle cx="20" cy="16" r="5" />
	<path d="M25 16H68L84 32" />
	<path d="M120 32V72" />
	<rect x="110" y="72" width="20" height="14" rx="3" />
	<path d="M132 98H140M152 98H164M140 88V108M152 88V108" />
</svg>
